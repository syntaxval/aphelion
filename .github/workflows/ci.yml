name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Run library tests
        run: npm test

      - name: Typecheck all packages
        run: npm run typecheck

      - name: Build PWA & standalone offline HTML
        run: npm run build:web && npm run build:offline

      - name: Bundle offline HTML into GitHub Pages output
        run: |
          cp frontend/dist-offline/aphelion-offline.html frontend/dist/aphelion-offline.html
          cp frontend/dist-offline/aphelion-offline.html.sha256.txt frontend/dist/aphelion-offline.html.sha256.txt

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/dist
          branch: gh-pages
